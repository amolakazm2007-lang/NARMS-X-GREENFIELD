name: phase1-closure
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: narms_phase1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d narms_phase1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NARMS_PHASE1_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/narms_phase1
      NARMS_PHASE1_WORKFLOW_IDENTITY: phase1-closure.yml@v2.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install qualification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest cryptography mypy
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          PY
          mypy --version
          psql --version | grep -E ' 16([.]|$)'
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Phase-1 qualification
        run: python scripts/phase1_qualify_current.py
      - name: Assert 32 of 32
        run: |
          python - <<'PY'
          import json
          p=json.load(open('evidence/phase1-v2.8.0/qualification-report.json'))
          assert len(p['gates']) == 32
          assert all(v == 'PASS' for v in p['gates'].values())
          assert not p['blockers']
          print('PHASE 1: 32/32 PASS')
          PY
      - name: Build closure attestation envelope
        run: python scripts/build_phase1_attestation_current.py
      - name: Verify attestation is bound to qualification
        run: |
          python - <<'PY'
          import json
          from packages.phase1_attestation import verify_closure_attestation
          p=json.load(open('evidence/phase1-v2.8.0/qualification-report.json'))
          a=json.load(open('evidence/phase1-v2.8.0/closure-attestation.json'))
          v=verify_closure_attestation(a,p,expected_workflow_identity='phase1-closure.yml@v2.8.0')
          assert v['valid'], v
          print('ATTESTATION:', v['attestation_root'])
          PY
      - name: Upload unsigned qualification + attestation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1-v2.8.0-closure-evidence
          path: |
            evidence/phase1-v2.8.0/qualification-report.json
            evidence/phase1-v2.8.0/closure-attestation.json
